name = "wakeel"
main = "src/index.ts"
compatibility_date = "2026-10-04"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Static frontend (built by `npm run web:build` -> web/dist)
# ---------------------------------------------------------------------------
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------------
# D1 Database (free tier, no card required)
# Create with: wrangler d1 create wakeel-db
# Then paste the returned database_id below.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "wakeel-db"
database_id = "0f072c3c-d160-468a-a8d3-3d1a1fa9da06"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# Cloudflare Workers AI binding (free allocation, no card required)
# ---------------------------------------------------------------------------
[ai]
binding = "AI"

# Cloudflare Browser Run: Free plan includes 10 browser minutes/day.
# The app also enforces a shared daily 10-minute ceiling.
[browser]
binding = "BROWSER"

# ---------------------------------------------------------------------------
# Public settings live in [vars]. Store API keys, Supabase secrets and webhook secrets with
# `wrangler secret put NAME`. The receiving wallet address is public and intentionally configured below.
# Never place a private key or seed phrase in this file or in Worker secrets.
# ---------------------------------------------------------------------------
[triggers]
# Passively detect USDT transfers and credit matching invoices without admin action.
crons = ["*/5 * * * *"]

[vars]
APP_NAME = "Wakeel"
APP_ENV = "development"
# Optional: comma-separated exact origins for a separately hosted frontend; same-origin is the default.
# CORS_ALLOWED_ORIGINS = "https://app.example.com"
MAX_FREE_AI_CALLS_PER_DAY = "200"
MAX_BROWSER_TASKS_PER_DAY = "20"
MAX_TASK_RUNTIME_MS = "180000"
# Workers limit the work (subrequests/CPU) of one request; the agent does this many steps per request and the
# client auto-continues. Raise it (e.g. 6) only on a paid Workers plan.
MAX_STEPS_PER_INVOCATION = "1"
MAX_FILE_SIZE_MB = "20"
MAX_PROJECTS_PER_USER = "50"
MAX_STORAGE_MB_PER_USER = "150"

# Public receiving address: automatic USDT/BEP-20 verification runs on BNB Smart Chain mainnet.
TRUST_WALLET_ADDRESS = "0x8575DB82A480428Ef0d9eB9b9a62de3453303Fc9"
TRUST_WALLET_NETWORK = "BSC Mainnet (BEP20)"
TRUST_WALLET_TOKEN = "USDT (BEP20 / Binance-Peg BSC-USD)"
BSC_RPC_URL = "https://bsc-dataseed.bnbchain.org"
